<!doctype html><meta charset="utf-8"><title>Exporting Triproam video…</title>
<style>body{margin:0;background:#163b32;color:#fff;font:20px system-ui;display:grid;place-items:center;height:100vh}canvas{width:min(90vw,960px);border-radius:18px;box-shadow:0 20px 70px #0008}p{position:fixed;bottom:5vh}</style>
<canvas width="1280" height="720"></canvas><p id="status">Rendering Triproam promo…</p>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),status=document.querySelector('#status');
const scenes=[['Great trips shouldn’t end in awkward math.','Who paid for dinner? Who covered the taxi?','problem'],['Receipts pile up. Memories get messy.','Group costs get scattered across chats and notes.','receipts'],['Meet Triproam.','Record expenses, split fairly, and see who owes what.','solution'],['Make every trip feel lighter.','Triproam — your trip, your people, your peace of mind.','done']];
function round(r,rad){x.beginPath();x.roundRect(r[0],r[1],r[2],r[3],rad);x.fill()};function person(px,py,col,skin){x.fillStyle=skin;x.beginPath();x.arc(px,py,42,0,7);x.fill();x.fillStyle=col;round([px-62,py+35,124,190],28);x.fillStyle='#453229';x.beginPath();x.arc(px,py-20,44,Math.PI,0);x.fill()}
function draw(t){let i=Math.min(3,Math.floor(t/6)), q=(t%6)/6, s=scenes[i];x.fillStyle='#fffaf0';x.fillRect(0,0,1280,720);x.fillStyle='#e3edd4';x.beginPath();x.arc(1150,-20,330,0,7);x.fill();x.fillStyle='#f7d8b7';x.beginPath();x.arc(0,760,210,0,7);x.fill();x.fillStyle='#24604d';x.font='900 52px system-ui';x.fillText('triproam',90,90);x.fillStyle='#718a65';x.font='800 18px system-ui';x.fillText(i==0?'THE PROBLEM':i==1?'WHY IT’S HARD':i==2?'THE SOLUTION':'TRAVEL TOGETHER. SETTLE SMARTER.',90,140);x.fillStyle='#163b32';x.font='900 58px system-ui';let words=s[0].split(' '), line='',yy=260;for(let w of words){if(x.measureText(line+w).width>700){x.fillText(line,90,yy);yy+=68;line=''}line+=w+' '}x.fillText(line,90,yy);x.fillStyle='#557168';x.font='28px system-ui';x.fillText(s[1],90,yy+70);if(i<2){person(850,300,'#24604d','#c98058');person(1010,350,'#db765e','#9d644b');person(1170,300,'#e1b24e','#b97652');if(i==1){for(let j=0;j<3;j++){x.fillStyle='#fff';round([760+j*150,540-(j%2)*70,120,70],8);x.fillStyle='#ed8d70';x.font='bold 18px system-ui';x.fillText(['DINNER ₹2,400','TAXI ₹680','COFFEE ₹320'][j],770+j*150,580-(j%2)*70)}}}else{x.fillStyle='#163b32';round([900,170,220,420],30);x.fillStyle='#f9fff3';round([920,205,180,350],18);x.fillStyle='#e4efd8';round([940,240,140,80],14);x.fillStyle='#163b32';x.font='bold 22px system-ui';x.fillText(i==2?'Trip total':'All settled',955,275);x.font='bold 34px system-ui';x.fillText(i==2?'₹3,400':'₹0 pending',950,310);x.fillStyle='#2b8b62';x.font='bold 90px system-ui';x.fillText('✓',975,480)}x.fillStyle='#ed8d70';x.fillRect(0,714,(t/24)*1280,6)}
const stream=c.captureStream(30), rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9'}), chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='triproam-promo.webm';a.click();status.textContent='Done — your Triproam video has downloaded.'};rec.start();let start=performance.now();function loop(now){let t=(now-start)/1000;draw(Math.min(t,24));status.textContent=`Rendering Triproam promo… ${Math.round(Math.min(t/24,1)*100)}%`;if(t<24)requestAnimationFrame(loop);else setTimeout(()=>rec.stop(),300)}requestAnimationFrame(loop);
</script>
